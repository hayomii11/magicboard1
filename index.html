<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
    margin: 0;
    min-height: 100vh;
    background-color: rgb(15, 15, 15);
}

.page {
    position: relative;
    min-height: 100vh;
    background-image: url("cont1.png");
    background-size: cover;
    background-position: top center;
    background-repeat: no-repeat;
}

.button-3d-container {
    position: absolute;
    top: 410px;
    left: 700px;
    width: 220px;
    height: 90px;
}

.img-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.15s ease;
}

.img-btn img {
    display: block;
    height: 90px;
    width: auto;
    pointer-events: none;
}

.img-btn:hover  { transform: translateY(-3px); }
.img-btn:active { transform: translateY(2px); }
.btn-3d {
    width: 100%;
    height: 100%;
    background-color: #4CAF50;
    color: white;
    font-family: 'BingBoss', sans-serif, Arial;
    font-size: 40px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    outline: none;
    box-shadow: 0 8px #2E7D32, 0 12px 15px rgba(0, 0, 0, 0.4);
    transition: all 0.1s ease;
}

.btn-3d:hover {
    background-color: #43A047;
    box-shadow: 0 10px #2E7D32, 0 14px 18px rgba(0, 0, 0, 0.5);
    transform: translateY(-2px);
}

.btn-3d:active {
    background-color: #388E3C;
    box-shadow: 0 2px #1B5E20, 0 4px 6px rgba(0, 0, 0, 0.4);
    transform: translateY(6px);
}

@font-face {
    font-family: "BingBoss";
    src: url("bing_boss/bing boss.otf");
}

/* PAGE 2 */
#page2 {
    display: none;
    background-image: url("page22.png");
    color: #333;
    padding: 30px;
    box-sizing: border-box;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
}

.paper {
    position: absolute;
    top: 20px;
    left: 250px;
    width: 780px;
    height: 450px;
    background-color: #fff;
    border-radius: 1px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    box-sizing: border-box;
    overflow: hidden;
    border: 8px solid #8f8f8f;
    touch-action: none;
}
#canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: crosshair;
}


.shelf {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
}

.crayon, .eraser {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.15s ease;
    position: absolute;
    pointer-events: auto;
}

.crayon img, .eraser img { display: block; width: auto; pointer-events: none; }


.green  { left: 280px; top: 459px; }  .green img  { height: 130px; }
.black  { left: 320px; top: 455px; }  .black img  { height: 150px; }
.purple { left: 350px; top: 455px; }  .purple img { height: 150px; }
.blue   { left: 390px; top: 450px; }  .blue img   { height: 170px; }
.pink   { left: 420px; top: 455px; }  .pink img   { height: 150px; }
.yellow { left: 475px; top: 460px; }  .yellow img { height: 140px; }
.red    { left: 520px; top: 455px; }  .red img    { height: 140px; }
.orange { left: 560px; top: 455px; }  .orange img { height: 140px; }
.eraser-btn { left: 600px; top: 480px; }  .eraser-btn img { height: 100px; }

.crayon:hover, .eraser:hover { transform: translateY(-10px); }

.btn-back img   { height: 95px; }
.btn-delete img { height: 80px; }
.btn-back {
    position: absolute;
    top: 7px;
    left: 150px;
}

.btn-delete {
    position: absolute;
    top: 20px;
    right: 110px;
}

/* ---- Tools panel (size + line type), sits on the cork board next to the pens ---- */
.tools-box {
    position: absolute;
    left: 720px;          /* move left/right */
    top: 510px;           /* move up/down */
    width: 270px;
    box-sizing: border-box;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: rgba(40, 28, 18, 0.75);
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 10px;
    color: #fff;
    font-family:  'BingBoss', Arial, sans-serif;

    font-size:20px;
    pointer-events: auto;
}

.tools-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.tools-row label {
    width: 38px;
    flex-shrink: 0;
}

.tools-row input[type="range"] { flex: 1; min-width: 0; }

.tools-row select {
    flex: 1;
    min-width: 0;
    padding: 4px 6px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    color: #333;
    background: #fff7e0;
    border: 2px solid #c9a35b;
    border-radius: 6px;
    cursor: pointer;
}

/* ---- Side menus (shapes on the left, stickers on the right) ---- */
.side-menu {
    position: absolute;
    width: 190px;
    height: 450px;                          /* LENGTH of the menu: bigger = longer */
    box-sizing: border-box;
    padding: 10px;
    display: flex;
    flex-direction: column;
    background: rgba(20, 20, 20, 0.35);     /* transparency: last number, 0 = invisible, 1 = solid */
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 12px;
    color: #fff;
    font-family: 'BingBoss', Arial, sans-serif;
    font-size: 20px;
    pointer-events: auto;
}

.side-menu h3 {
    margin: 0 0 8px;
    font-weight: normal;
    font-size: 22px;
    text-align: center;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
}

.menu-left  { left: 20px;  top: 110px; }   /* move the left menu  */
.menu-right { right: 15px; top: 110px; }   /* move the right menu */

/* the area that holds the buttons; it scrolls if you add many */
.menu-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);   /* buttons per row (same for both menus) */
    gap: 8px;
    align-content: start;
    overflow-y: auto;
    padding-right: 2px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.5) transparent;
}

.tool-btn, .face-btn {
    aspect-ratio: 1 / 1;
    padding: 6px;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
}

.tool-btn img, .face-btn img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

/* shape icons */
.tool-btn svg {
    display: block;
    width: 100%;
    height: 100%;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
}

.tool-btn:hover, .face-btn:hover {
    background: rgba(255, 255, 255, 0.4);
    transform: translateY(-2px);
}

.tool-btn:active, .face-btn:active { transform: translateY(1px); }

.tool-btn.active, .face-btn.active {
    background: rgba(255, 255, 255, 0.55);
    border-color: #fff;
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
}

.fill-row {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 18px;
    cursor: pointer;
}

.fill-row input { width: 18px; height: 18px; cursor: pointer; }

</style>
</head>

<body>

<div id="page1" class="page">
    <div class="button-3d-container">
        <button class="btn-3d" onclick="nextPage()">play</button>
    </div>
</div>

<div id="page2" class="page">

  <button class="btn-back img-btn" onclick="previousPage()">
    <img src="exit.png" alt="Exit">
</button>
<button class="btn-delete img-btn" onclick="clearPaper()">
    <img src="delete.png" alt="Delete">
</button>

    <div class="paper">
        <canvas id="canvas" width="784" height="434"></canvas>
    </div>

    <div class="shelf">
        <button class="crayon green" data-color="#7ec43f" data-note="261.63"><img src="green.png"  alt="Green"></button>
        <button class="black crayon" data-color="#222222" data-note="293.66"><img src="black.png"  alt="Black"></button>
        <button class="purple crayon" data-color="#a56bc9" data-note="329.63"><img src="purple.png" alt="Purple"></button>
        <button class="blue crayon" data-color="#2f63c4" data-note="349.23"><img src="blue.png"   alt="Blue"></button>
        <button class="pink crayon" data-color="#ee4a9a" data-note="392.00"><img src="pink.png"   alt="Pink"></button>
        <button class="yellow crayon" data-color="#f2c82a" data-note="440.00"><img src="yellow.png" alt="Yellow"></button>
        <button class="red crayon" data-color="#c4223f" data-note="493.88"><img src="red.png"    alt="Red"></button>
        <button class="orange crayon" data-color="#f08a24" data-note="523.25"><img src="orange.png" alt="Orange"></button>
        <button class="eraser eraser-btn" id="eraser"><img src="eraser.png" alt="Eraser"></button>

        <!-- size + line type -->
        <div class="tools-box">
            <div class="tools-row">
                <label for="size">Size</label>
                <input id="size" type="range" min="2" max="40" value="10" title="Brush size">
            </div>
            <div class="tools-row">
                <label for="brush">Line</label>
                <select id="brush" title="Line type">
                    <option value="crayon">Crayon</option>
                    <option value="chalk">Chalk</option>
                    <option value="marker">Marker</option>
                    <option value="pencil">Pencil</option>
                    <option value="spray">Spray</option>
                </select>
            </div>
        </div>

        <!-- LEFT MENU: shapes (ready to use) -->
        <div class="side-menu menu-left">
            <h3>Shapes</h3>
            <div class="menu-grid">
                <button class="tool-btn" data-tool="line" title="Line">
                    <svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="4"/></svg>
                </button>
                <button class="tool-btn" data-tool="rect" title="Rectangle">
                    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12"/></svg>
                </button>
                <button class="tool-btn" data-tool="circle" title="Circle">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>
                </button>
                <button class="tool-btn" data-tool="triangle" title="Triangle">
                    <svg viewBox="0 0 24 24"><polygon points="12,3 21,20 3,20"/></svg>
                </button>
                <button class="tool-btn" data-tool="star" title="Star">
                    <svg viewBox="0 0 24 24"><polygon points="12,2 14.9,8.6 22,9.3 16.6,14 18.2,21 12,17.3 5.8,21 7.4,14 2,9.3 9.1,8.6"/></svg>
                </button>
                <button class="tool-btn" data-tool="heart" title="Heart">
                    <svg viewBox="0 0 24 24"><path d="M12 20 C4 14 3 10 3 8 C3 5 5 3.5 7.5 3.5 C9.5 3.5 11 4.8 12 6.5 C13 4.8 14.5 3.5 16.5 3.5 C19 3.5 21 5 21 8 C21 10 20 14 12 20Z"/></svg>
                </button>
                <button class="tool-btn" data-tool="diamond" title="Diamond">
                    <svg viewBox="0 0 24 24"><polygon points="12,2 22,12 12,22 2,12"/></svg>
                </button>
                <button class="tool-btn" data-tool="arrow" title="Arrow">
                    <svg viewBox="0 0 24 24"><polygon points="3,9 13,9 13,4 21,12 13,20 13,15 3,15"/></svg>
                </button>
            </div>
            <label class="fill-row">
                <input type="checkbox" id="fill"> Fill shape
            </label>
        </div>

        <!-- RIGHT MENU: stickers (empty slots for your own images)
             the picture inside each button is also the sticker stamped on the paper -->
        <div class="side-menu menu-right">
            <h3>Stickers</h3>
            <div class="menu-grid">
                <button class="face-btn"><img src="1.png" alt=""></button>
                <button class="face-btn"><img src="2.png" alt=""></button>
                <button class="face-btn"><img src="3.png" alt=""></button>
                <button class="face-btn"><img src="4.png" alt=""></button>
                <button class="face-btn"><img src="5.png" alt=""></button>
                <button class="face-btn"><img src="6.png" alt=""></button>
                <button class="face-btn"><img src="7.png" alt=""></button>
                <button class="face-btn"><img src="8.png" alt=""></button>
            </div>
        </div>
    </div>

</div>

<script>
const audio = new (window.AudioContext || window.webkitAudioContext)();

function playNote(freq) {
    const osc  = audio.createOscillator();
    const gain = audio.createGain();

    osc.type = "triangle";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.4, audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.8);

    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + 0.8);
}
function nextPage() {
    document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "flex";
}

function previousPage() {
    document.getElementById("page2").style.display = "none";
    document.getElementById("page1").style.display = "block";
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const sizeInput = document.getElementById("size");
const brushSelect = document.getElementById("brush");
const fillBox = document.getElementById("fill");
let color = "#7ec43f", erasing = false, drawing = false, last = null;

/* current tool: "draw" (normal), a shape name, or "stamp" */
let tool = "draw", stampImg = null, shapeStart = null, snapshot = null;

function fillWhite() { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
fillWhite();
function clearPaper() { fillWhite(); }

function setActive(el) {
    document.querySelectorAll(".crayon, .eraser").forEach(b => b.classList.remove("active"));
    el.classList.add("active");
}

/* name = which tool, btn = the menu button to highlight (null = none highlighted) */
function setTool(name, btn) {
    tool = name;
    document.querySelectorAll(".tool-btn, .face-btn").forEach(b => b.classList.remove("active"));
    if (btn) btn.classList.add("active");
}

/* picking a crayon or the eraser goes back to normal drawing */
document.querySelectorAll(".crayon").forEach(b => b.addEventListener("click", () => {
    color = b.dataset.color;
    erasing = false;
    if (tool === "stamp") setTool("draw", null);   // a sticker has no color, so go back to drawing
    setActive(b);
    audio.resume();
    playNote(parseFloat(b.dataset.note));
}));
 function playBell() {
    const t0 = audio.currentTime;
    // 3 quick rings, like a jingle bell shaking
    [0, 0.09, 0.18].forEach((delay, k) => {
        const start = t0 + delay;
        const base = 1800 + k * 150;             // bell pitch
        [1, 2.76, 5.4, 8.93].forEach((ratio, i) => {   // bell-like overtones
            const osc  = audio.createOscillator();
            const gain = audio.createGain();
            osc.type = "sine";
            osc.frequency.value = base * ratio;
            const vol = 0.18 / (i + 1);
            gain.gain.setValueAtTime(vol, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.6);
            osc.connect(gain);
            gain.connect(audio.destination);
            osc.start(start);
            osc.stop(start + 0.6);
        });
    });
}
document.getElementById("eraser").addEventListener("click", e => {
    erasing = true;
    setTool("draw", null);
    setActive(e.currentTarget);
    audio.resume();
    playBell();
});

/* ---- Left menu: shapes (click the same shape again to go back to normal drawing) ---- */
document.querySelectorAll(".tool-btn").forEach(b => b.addEventListener("click", () => {
    erasing = false;
    audio.resume();
    playNote(660);
    if (tool === b.dataset.tool) { setTool("draw", null); return; }
    setTool(b.dataset.tool, b);
}));

/* ---- Right menu: stickers (click the same sticker again to go back to normal drawing) ---- */
document.querySelectorAll(".face-btn").forEach(b => b.addEventListener("click", () => {
    erasing = false;
    audio.resume();
    playNote(784);
    const img = b.querySelector("img");
    if (tool === "stamp" && stampImg === img) { setTool("draw", null); return; }
    stampImg = img;
    setTool("stamp", b);
}));

function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * canvas.width / r.width,
             y: (e.clientY - r.top) * canvas.height / r.height };
}

/* ---- Line types: each one draws a single "dab" at x, y ---- */
const brushes = {
    // original textured crayon
    crayon(x, y, s) {
        const n = Math.ceil(s * 1.5);
        for (let i = 0; i < n; i++) {
            const a = Math.random() * 6.283, d = Math.sqrt(Math.random()) * s / 2;
            ctx.globalAlpha = 0.55 + Math.random() * 0.45;
            ctx.fillRect(x + Math.cos(a) * d, y + Math.sin(a) * d, 2, 2);
        }
    },
    // dusty, grainy, with gaps like chalk on a board
    chalk(x, y, s) {
        const n = Math.ceil(s * 3);
        for (let i = 0; i < n; i++) {
            if (Math.random() < 0.35) continue;           // random gaps
            const a = Math.random() * 6.283, d = Math.sqrt(Math.random()) * s / 1.7;
            const w = 1 + Math.random() * 2.5;
            ctx.globalAlpha = 0.15 + Math.random() * 0.5;
            ctx.fillRect(x + Math.cos(a) * d, y + Math.sin(a) * d, w, w);
        }
    },
    // smooth solid round line
    marker(x, y, s) {
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(x, y, s / 2, 0, 6.283);
        ctx.fill();
    },
    // thin, slightly rough line
    pencil(x, y, s) {
        const r = Math.max(1, s / 4);
        const n = Math.ceil(r * 2);
        for (let i = 0; i < n; i++) {
            const a = Math.random() * 6.283, d = Math.sqrt(Math.random()) * r;
            ctx.globalAlpha = 0.5 + Math.random() * 0.4;
            ctx.fillRect(x + Math.cos(a) * d, y + Math.sin(a) * d, 1.2, 1.2);
        }
    },
    // scattered spray-paint dots
    spray(x, y, s) {
        const n = Math.ceil(s * 2);
        for (let i = 0; i < n; i++) {
            const a = Math.random() * 6.283, d = Math.random() * s * 1.2;
            ctx.globalAlpha = 0.3 + Math.random() * 0.5;
            ctx.fillRect(x + Math.cos(a) * d, y + Math.sin(a) * d, 1.5, 1.5);
        }
    }
};

function dab(x, y) {
    const s = +sizeInput.value;
    if (erasing) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(x, y, s * 1.2, 0, 7); ctx.fill();
        return;
    }
    ctx.fillStyle = color;
    (brushes[brushSelect.value] || brushes.crayon)(x, y, s);
    ctx.globalAlpha = 1;
}

function stroke(a, b) {
    const steps = Math.max(1, Math.floor(Math.hypot(b.x - a.x, b.y - a.y) / 2));
    for (let i = 0; i <= steps; i++) {
        dab(a.x + (b.x - a.x) * i / steps, a.y + (b.y - a.y) * i / steps);
    }
}

/* ---- Shapes: drag on the paper, the shape fits the box you drag ---- */
function drawShape(type, a, b) {
    ctx.globalAlpha = 1;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(2, +sizeInput.value / 2);   // line thickness follows the Size slider
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
    const cx = x + w / 2, cy = y + h / 2;

    ctx.beginPath();
    if (type === "line") {
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
    } else if (type === "rect") {
        ctx.rect(x, y, w, h);
    } else if (type === "circle") {
        ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
    } else if (type === "triangle") {
        ctx.moveTo(cx, y);
        ctx.lineTo(x + w, y + h);
        ctx.lineTo(x, y + h);
        ctx.closePath();
    } else if (type === "star") {
        for (let i = 0; i < 10; i++) {
            const ang = -Math.PI / 2 + i * Math.PI / 5;
            const k = i % 2 === 0 ? 1 : 0.45;
            const px = cx + Math.cos(ang) * (w / 2) * k;
            const py = cy + Math.sin(ang) * (h / 2) * k;
            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
    } else if (type === "heart") {
        ctx.moveTo(cx, y + h * 0.3);
        ctx.bezierCurveTo(cx, y, x, y, x, y + h * 0.35);
        ctx.bezierCurveTo(x, y + h * 0.65, cx, y + h * 0.8, cx, y + h);
        ctx.bezierCurveTo(cx, y + h * 0.8, x + w, y + h * 0.65, x + w, y + h * 0.35);
        ctx.bezierCurveTo(x + w, y, cx, y, cx, y + h * 0.3);
        ctx.closePath();
    } else if (type === "diamond") {
        ctx.moveTo(cx, y);
        ctx.lineTo(x + w, cy);
        ctx.lineTo(cx, y + h);
        ctx.lineTo(x, cy);
        ctx.closePath();
    } else if (type === "arrow") {
        ctx.moveTo(x, y + h * 0.3);
        ctx.lineTo(x + w * 0.6, y + h * 0.3);
        ctx.lineTo(x + w * 0.6, y);
        ctx.lineTo(x + w, cy);
        ctx.lineTo(x + w * 0.6, y + h);
        ctx.lineTo(x + w * 0.6, y + h * 0.7);
        ctx.lineTo(x, y + h * 0.7);
        ctx.closePath();
    }
    if (fillBox.checked && type !== "line") ctx.fill();
    ctx.stroke();
}

/* stamp the chosen sticker image; its size follows the Size slider */
function placeStamp(p) {
    if (!stampImg || !stampImg.naturalWidth) return;     // image missing or not loaded
    const longSide = +sizeInput.value * 3 + 30;
    const ratio = stampImg.naturalWidth / stampImg.naturalHeight;
    const w = ratio >= 1 ? longSide : longSide * ratio;
    const h = ratio >= 1 ? longSide / ratio : longSide;
    ctx.globalAlpha = 1;
    ctx.drawImage(stampImg, p.x - w / 2, p.y - h / 2, w, h);
}

canvas.addEventListener("pointerdown", e => {
    const p = pos(e);

    if (tool === "stamp") { placeStamp(p); return; }

    drawing = true;
    canvas.setPointerCapture(e.pointerId);

    if (tool !== "draw") {                      // a shape: remember the start and a copy of the paper
        shapeStart = p;
        snapshot = document.createElement("canvas");
        snapshot.width = canvas.width;
        snapshot.height = canvas.height;
        snapshot.getContext("2d").drawImage(canvas, 0, 0);
        return;
    }
    last = p;
    stroke(last, last);
});
canvas.addEventListener("pointermove", e => {
    if (!drawing) return;
    const p = pos(e);

    if (tool !== "draw") {                      // live preview of the shape
        ctx.globalAlpha = 1;
        ctx.drawImage(snapshot, 0, 0);
        drawShape(tool, shapeStart, p);
        return;
    }
    stroke(last, p);
    last = p;
});
["pointerup", "pointercancel"].forEach(t => canvas.addEventListener(t, () => {
    drawing = false;
    snapshot = null;
}));
</script>
